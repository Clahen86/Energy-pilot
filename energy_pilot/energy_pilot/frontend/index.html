<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Energipilot</title>
<style>
  :root {
    --bg:#06080d; --surface:#0d1118; --surface2:#131924; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#f3f5f9; --muted:#8b93a3; --faint:#5b6372;
    --sun:#f5b544; --grid:#6ea8fe; --sell:#3ddc97; --batt:#a78bfa; --car:#f472b6; --house:#e8ebf1;
    --ok:#3ddc97; --warn:#f5b544; --bad:#ff5d6c; --accent:#7c6cff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) { --bg:#f4f6fa; --surface:#ffffff; --surface2:#f0f3f8; --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.14);
      --text:#0b1220; --muted:#5d6676; --faint:#9aa3b2; --house:#1f2937; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1, "cv11" 1; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:radial-gradient(900px 420px at 50% -120px, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
  main { max-width:880px; margin:0 auto; padding:18px 16px 110px; }
  .top { display:flex; align-items:center; gap:10px; padding:2px 2px 14px; }
  .brand { display:flex; align-items:center; gap:10px; flex:1; }
  .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg, var(--accent), #22d3ee); }
  .logo svg { width:17px; height:17px; }
  .top h1 { font-size:19px; margin:0; letter-spacing:-.02em; font-weight:650; }
  .badge { font-size:12px; font-weight:600; padding:5px 11px; border-radius:20px; border:1px solid var(--line2); color:var(--muted); display:flex; align-items:center; gap:6px; }
  .badge i { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .badge.live i { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); animation:pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px transparent; } }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; margin-top:12px; }
  .eyebrow { font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; }
  .muted { color:var(--muted); font-size:13px; }
  .ic { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
  /* flow */
  .flow { padding:8px 4px 2px; }
  .flow svg { width:100%; height:auto; display:block; overflow:visible; }
  .flow { position:relative; overflow:hidden; } .flow > .scene { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; } .flow > #flow { position:relative; }
  .sc-twinkle { animation:sctw 3.2s ease-in-out infinite; } @keyframes sctw { 50% { opacity:.25; } }

  .sc-fall { animation:scfall 12s linear infinite; } @keyframes scfall { from { transform:translate(0,0) rotate(var(--r,0deg)); } to { transform:translate(30px,420px) rotate(calc(var(--r,0deg) + 200deg)); } }
  .sc-rain { animation:scrain 1.1s linear infinite; } @keyframes scrain { to { transform:translate(-14px,390px); } }
  .sc-rise { animation:scrise 9s ease-out infinite; } @keyframes scrise { from { transform:translate(0,0); opacity:.8; } to { transform:translate(18px,-300px); opacity:0; } }
  .sc-float { animation:scfl 12s ease-in-out infinite alternate; } @keyframes scfl { to { transform:translate(22px,-16px); } }
  .sc-drift { animation:scdr 30s ease-in-out infinite alternate; } @keyframes scdr { to { transform:translateX(40px); } }

  .n-val { font:650 17px -apple-system, "SF Pro Display", Inter, system-ui, sans-serif; fill:var(--text); text-anchor:middle; letter-spacing:-.02em; }
  .n-unit { font:500 11px system-ui, sans-serif; fill:var(--muted); }
  .n-cap { font:600 10.5px system-ui, sans-serif; fill:var(--muted); text-anchor:middle; letter-spacing:.08em; text-transform:uppercase; }
  .base { fill:none; stroke:var(--line2); stroke-width:1.5; }
  .lane { fill:none; stroke-width:1.2; stroke-opacity:.18; }
  .node .halo { fill:var(--nc); opacity:0; }

  .nbg { fill:var(--surface2); }

  .flow { background-image:radial-gradient(color-mix(in srgb, var(--text) 7%, transparent) 1px, transparent 1px); background-size:18px 18px; background-position:center; }

  .beam.rev { animation-direction:reverse; }

  /* status */
  .status { display:flex; gap:14px; align-items:flex-start; position:relative; overflow:hidden; }
  .status::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px; background:var(--c); }
  .dotc { width:38px; height:38px; flex:none; border-radius:12px; display:grid; place-items:center; color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent); margin-left:6px; }
  .dotc svg { width:20px; height:20px; }

  .metric { background:var(--surface); padding:16px; }
  .metric .lbl { font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .metric .v { font-size:26px; font-weight:650; letter-spacing:-.03em; margin-top:8px; line-height:1.1; }
  .metric .v small { font-size:13px; font-weight:500; color:var(--muted); margin-left:3px; letter-spacing:0; }
  .metric .s { font-size:12px; color:var(--muted); margin-top:4px; }
  .lvl { font-weight:650; } .lvl.cheap { color:var(--ok); } .lvl.mid { color:var(--warn); } .lvl.dear { color:var(--bad); }
  .bar { height:4px; border-radius:2px; background:var(--surface2); margin-top:10px; overflow:hidden; } .bar span { display:block; height:100%; border-radius:2px; background:var(--batt); }
  /* plan */

  .plan { display:block; }

  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:12px; }
  .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:6px; vertical-align:3px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }

  .tip { min-height:20px; font-size:13px; margin-top:4px; color:var(--muted); } .tip b { color:var(--text); }

  .ctl + .ctl { margin-top:0; }
  .ctl .t b { display:block; font-weight:600; } .ctl .t span { font-size:12.5px; color:var(--muted); }
  .toggle { width:51px; height:31px; border-radius:16px; border:0; background:color-mix(in srgb, var(--muted) 35%, var(--surface2)); position:relative; cursor:pointer; flex:none; transition:.25s; box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--muted) 70%, transparent); }
  .toggle::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; transition:.25s; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .toggle.on { background:var(--ok); box-shadow:none; } .toggle.car.on { background:var(--car); } .toggle.on::after { left:22px; }
  input[type=time] { font:650 20px system-ui; color:var(--text); background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:6px 10px; color-scheme:dark; }
  @media (prefers-color-scheme: light) { input[type=time] { color-scheme:light; } }
  .range { display:flex; align-items:center; gap:12px; min-width:52%; } .range input { flex:1; accent-color:var(--car); touch-action:pan-y; } .range b { min-width:62px; text-align:right; font-weight:650; }
  /* shadow */

  .app:first-of-type { border-top:0; padding-top:4px; }
  .ring { width:52px; height:52px; position:relative; grid-row:span 2; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); } .ring circle { fill:none; stroke-width:4; }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:12px; font-weight:650; }
  .app .t b { font-weight:600; } .app .t span { display:block; font-size:12.5px; color:var(--muted); }
  .evpct { font-size:28px; font-weight:700; letter-spacing:-.02em; } .evpct small { font-size:14px; color:var(--muted); margin-left:2px; }
  .evbar { position:relative; height:8px; border-radius:6px; background:var(--surface2); margin:2px 0 12px; } .evbar span { position:absolute; inset:0 auto 0 0; border-radius:6px; background:var(--car); }
  .evbar i { position:absolute; top:-4px; width:2px; height:16px; margin-left:-1px; background:var(--text); border-radius:1px; }
  .seg.evt button { padding:7px 8px; }
  .seg { display:flex; background:var(--surface2); border-radius:11px; padding:3px; gap:2px; border:1px solid var(--line); }

  .seg button.on { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .seg button.on.control { color:var(--ok); } .seg button.on.shadow { color:var(--accent); }
  .stopall { width:100%; margin-top:10px; padding:13px; border-radius:14px; border:1px solid color-mix(in srgb, var(--bad) 35%, transparent); font:inherit; font-weight:650;
    background:color-mix(in srgb, var(--bad) 10%, transparent); color:var(--bad); cursor:pointer; }
  details.more { margin:4px 0 0 66px; } details.more summary { cursor:pointer; color:var(--faint); font-size:12.5px; }
  table { width:100%; border-collapse:collapse; font-size:12px; } td, th { text-align:left; padding:5px 4px; border-top:1px solid var(--line); word-break:break-word; color:var(--muted); } th { color:var(--faint); font-weight:600; }

  .set { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .set span { flex:1; font-size:14px; }

  .rl { display:block; font-weight:500; font-size:14px; }
  .src { display:inline-block; font-style:normal; font-size:11px; font-weight:600; margin-top:2px; color:var(--muted); }
  .src.energy, .src.integration { color:var(--ok); } .src.name { color:var(--warn); } .src.none { color:var(--faint); } .src.known, .src.chosen { color:var(--accent); }
  .link { border:0; background:none; color:var(--accent); font:inherit; font-size:12px; font-weight:650; cursor:pointer; letter-spacing:0; text-transform:none; }
  details.adv { margin-top:6px; border-top:1px solid var(--line2); padding-top:8px; } details.adv > summary { cursor:pointer; color:var(--faint); font-size:13px; font-weight:600; padding:4px 0; }
  .chkrow { padding:8px 0; border-top:1px solid var(--line2); } .chkrow:first-of-type { border-top:0; } .chkrow p { margin:0 0 4px; font-size:13.5px; }
  .chkrow.warn p { color:var(--warn); } .chkbtns { display:flex; gap:14px; }
  .bathead { margin:14px 0 2px; font-size:13px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  .batbox { border-top:1px solid var(--line2); margin-top:12px; padding-top:4px; }
  .ghostbtn { width:100%; margin-top:16px; padding:12px; border-radius:14px; border:1px solid var(--line2); background:transparent; color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  .hero { text-align:center; padding:26px 10px 6px; }
  .hero h2 { font-size:26px; letter-spacing:-.03em; margin:16px 0 8px; font-weight:700; }
  .hero p { max-width:440px; margin:0 auto; }
  .logo.big { width:58px; height:58px; border-radius:18px; margin:0 auto; box-shadow:0 18px 40px -12px var(--accent); } .logo.big svg { width:30px; height:30px; }
  .steps { list-style:none; padding:0; margin:22px auto 6px; max-width:440px; text-align:left; display:grid; gap:10px; }
  .steps li { display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .steps li svg { width:22px; height:22px; color:var(--accent); flex:none; margin-top:1px; } .steps b { display:block; font-weight:650; } .steps span { font-size:13px; color:var(--muted); }
  .cta { display:block; width:100%; max-width:440px; margin:18px auto 8px; padding:15px; border:0; border-radius:16px; font:inherit; font-size:16px; font-weight:650; color:#fff; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), #22d3ee); box-shadow:0 16px 34px -14px var(--accent); }
  .styles { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .style { text-align:left; display:flex; flex-direction:column; gap:3px; padding:14px; border-radius:16px; border:1px solid var(--line2); background:var(--surface2);
    color:var(--text); font:inherit; cursor:pointer; transition:.2s; }
  .style svg { width:20px; height:20px; color:var(--muted); margin-bottom:6px; } .style b { font-weight:650; font-size:14px; } .style span { font-size:12px; color:var(--muted); line-height:1.35; }
  .style.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); box-shadow:0 10px 24px -14px var(--accent); } .style.on svg { color:var(--accent); }
  .numin { width:84px; font:650 16px system-ui; text-align:right; color:var(--text); background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:7px 9px; }

  .tou { margin:4px 0 0; padding:4px 12px 12px; border-radius:16px; background:var(--surface2); }

  .lrow { display:flex; align-items:baseline; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .lrow span { flex:1; } .lrow b { font-weight:650; } .lrow b.good { color:var(--ok); } .lrow em { font-style:normal; font-size:12px; color:var(--muted); min-width:90px; text-align:right; }
  .sec-head { display:flex; gap:12px; align-items:center; margin-bottom:4px; }

  .sec-ic svg { width:19px; height:19px; } .sec-head b { display:block; font-size:16px; font-weight:650; } .sec-head span { font-size:12.5px; color:var(--muted); }

  .ctl:has(.seg.wide) { flex-wrap:wrap; } .seg.wide { width:100%; }
  .cpart { padding:14px 0; border-top:1px solid var(--line); } .cp-head { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .cp-head b { display:block; font-weight:650; } .cp-head span { font-size:12.5px; color:var(--muted); }

  .stile b { font-size:17px; } .stile b.bad { color:var(--warn); }

  .ready b { font-size: 12.5px; color: var(--text); } .ready.ok b { color: var(--ok); }

  .set .del { border: none; background: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 6px; }

    border: 1px solid var(--line, rgba(127,127,127,.25)); background: transparent; color: inherit; }
  /* Phone width: nothing may stick out of a card - rows wrap, and the role extras get their own line. */
