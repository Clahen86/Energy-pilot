function flowPaths(f) {

  const out = {};

      const w = Math.min(src[s], need[d]);

}

  setInterval(async () => {
    if (document.hidden) return;
    await load();
    if (tab === "home") patch();
    if (tab === "shadow") { status = await api("/api/status"); control = await api("/api/control"); if (!document.querySelector("details[open]")) render(true); }
  }, 4000);
  setInterval(() => { if (tab === "home" || tab === "plan") render(true); }, 300000);
})();
</script>
</body>
</html>
