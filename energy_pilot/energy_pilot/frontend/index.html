<style>

  .ic { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }

  const socRing = `<circle r="${r}" fill="none" stroke="var(--batt)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - soc / 100)}" transform="rotate(-90)" id="socring"/>`;
  const [pv, pvu] = split(f.pv), [ho, hou] = split(f.house), [gr, gru] = split(f.grid), [ev, evu] = split(f.ev);
  const battCap = f.battery > 30 ? `${T.charging}` : f.battery < -30 ? `${T.discharging}` : T.idle;
  return `<svg viewBox="-20 -20 400 352"><defs><filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="480" height="430"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${h.pv ? edge("M180 73 L180 117", f.pv, "var(--sun)", false) : ""}
    ${h.grid ? edge("M287 150 L213 150", f.grid, gridCol, (f.grid || 0) < 0) : ""}
    ${h.battery ? edge("M73 150 L147 150", f.battery, "var(--batt)", (f.battery || 0) > 0) : ""}
    ${h.ev ? edge("M180 183 L180 227", f.ev, "var(--car)", false) : ""}
    ${h.pv ? node("sun", 180, 40, "var(--sun)", pv, pvu, T.sun.toUpperCase(), "", "above") : ""}
    ${h.grid ? node("grid", 320, 150, gridCol, gr, gru, (f.grid < -30 ? T.sell : f.grid > 30 ? T.buy : T.grid).toUpperCase()) : ""}
    ${node("house", 180, 150, "var(--house)", ho, hou, null)}
    ${h.battery ? node("battery", 40, 150, "var(--batt)", `${num(f.soc, 0)}`, "%", `${battCap} ${f.battery && Math.abs(f.battery) > 30 ? kw(f.battery) : ""}`.trim().toUpperCase(), socRing) : ""}
    ${h.ev ? node("car", 180, 260, "var(--car)", f.ev > 30 ? ev : "–", f.ev > 30 ? evu : "", (f.ev > 30 ? T.charging : f.plug ? T.plugged : T.notPlugged).toUpperCase()) : ""}
  </svg>`;
}
function flowSig(f) {
  const b = (w) => w == null || Math.abs(w) < 30 ? 0 : (w > 0 ? 1 : -1) * (Math.abs(w) > 3000 ? 3 : Math.abs(w) > 1200 ? 2 : 1);
  return [b(f.pv), b(f.grid), b(f.battery), b(f.ev), Object.values(f.has).join()].join("|");
}

/* ---------- views ---------- */
function level(p, plan) {
  if (p == null || plan.price_min == null) return null;
  const x = (p - plan.price_min) / Math.max(0.01, plan.price_max - plan.price_min);
  return x < 0.33 ? "cheap" : x < 0.66 ? "mid" : "dear";
}
const DECCOL = { discharge: "var(--batt)", charge: "var(--sun)", grid: "var(--grid)", hold: "var(--accent)" };
const DECICON = { discharge: "arrowDown", charge: "arrowUp", grid: "bolt", hold: "pause" };
function home() {
  const d = data, f = d.flow, dec = d.decision;
  const reason = dec ? T.reasons[dec.kind].replace("{p}", kr(d.price.now)) : "";
  const lv = level(d.price.now, d.plan);
  const metric = (ic, lbl, v, unit, sub, id, extra = "") => `<div class="metric"><div class="lbl">${icon(ic)}${lbl}</div><div class="v" ${id ? `id="${id}"` : ""}>${v}<small>${unit}</small></div>${sub ? `<div class="s">${sub}</div>` : ""}${extra}</div>`;
  const metrics = [
    d.price.now != null ? metric("bolt", T.priceNow, num(d.price.now, 2), "kr/kWh", lv ? `<span class="lvl ${lv}">${T[lv]}</span> ${L === "da" ? "i dag" : "today"}` : "", "t-price") : "",
    d.solar.solar_today != null ? metric("sun", T.sunToday, num(d.solar.solar_today, 1), "kWh", d.solar.solar_tomorrow != null ? `${L === "da" ? "I morgen" : "Tomorrow"} ${num(d.solar.solar_tomorrow, 1)} kWh` : "") : "",
    f.soc != null ? metric("battery", T.battery, num(f.soc, 0), "%", dec?.target != null ? `${T.target} ${num(dec.target, 0)} %` : "", "t-soc", `<div class="bar"><span id="t-socbar" style="width:${f.soc}%"></span></div>`) : "",
    d.house_today != null ? metric("house", T.houseToday, num(d.house_today, 1), "kWh", L === "da" ? "forventet" : "expected") : "",
  ].join("");
  return `<div class="card flow fade" id="flow">${flowSvg(f)}</div>
    ${dec ? `<div class="card status fade" style="--c:${DECCOL[dec.kind]}"><div class="dotc">${icon(DECICON[dec.kind])}</div>
      <div><h2>${esc(dec.text)}</h2><p>${esc(reason)}</p>${dec.reason ? `<details><summary>${T.why}</summary>${esc(dec.reason)}</details>` : ""}</div></div>` : ""}
    <div class="metrics fade">${metrics}</div>
    ${d.ev ? carCard(d.ev, f) : ""}
    <div class="card fade"><div class="eyebrow"><span>${T.planTitle}</span></div>${planSvg(d.plan)}</div>`;
}
const CAR_ART = `<svg class="pic" viewBox="0 0 240 90" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M14 62c0-8 4-12 14-14l26-5 22-18c6-5 13-7 21-7h40c9 0 17 3 24 9l17 15 28 5c10 2 14 7 14 15v4c0 3-2 5-5 5h-11"/>
  <path d="M60 71H90M150 71h22M14 66c0 3 2 5 5 5h12"/><path d="M80 43h58l-16-17c-3-3-7-4-11-4H96c-4 0-8 2-11 5z" opacity=".55"/>
  <circle cx="45" cy="70" r="13"/><circle cx="45" cy="70" r="5" opacity=".6"/><circle cx="186" cy="70" r="13"/><circle cx="186" cy="70" r="5" opacity=".6"/></svg>`;
function carCard(ev, f) {
  const charging = (f.ev || 0) > 30;
  return `<div class="card fade"><div class="eyebrow"><span>${T.carTitle}</span>${ev.session_kwh != null ? `<span>${num(ev.session_kwh, 1)} kWh ${T.session}</span>` : ""}</div>
    <div class="car"><span style="color:${charging ? "var(--car)" : "var(--faint)"}">${CAR_ART}</span>
      <div><div class="st">${charging ? `${T.charging} ${kw(f.ev)}` : f.plug ? T.plugged : T.notPlugged}</div>
      <div class="muted">${charging ? (L === "da" ? "Bilen lader nu" : "The car is charging") : f.plug ? (L === "da" ? "Venter på sol eller billig strøm" : "Waiting for sun or cheap power") : (L === "da" ? "Sæt bilen i for at lade" : "Plug in to charge")}</div></div></div>
    ${ev.manual != null ? `<div class="ctl"><div class="t"><b>${T.chargeNow}</b><span>${L === "da" ? "Fuld fart nu, uanset pris" : "Full speed now, whatever the price"}</span></div><button class="toggle ${ev.manual ? "on" : ""}" data-ev="manual" aria-label="${T.chargeNow}"></button></div>` : ""}
    ${ev.ready != null ? `<div class="ctl"><div class="t"><b>${T.readyAt}</b><span>${L === "da" ? "Opladet til denne tid" : "Charged by this time"}</span></div><input type="time" data-ev="ready" value="${esc(String(ev.ready).slice(0, 5))}"></div>` : ""}
    ${ev.cap != null ? `<div class="ctl"><div class="t"><b>${T.atMost}</b><span>${L === "da" ? "Pr. opladning" : "Per charge"}</span></div><div class="range"><input type="range" min="0" max="${ev.cap_max || 100}" step="1" value="${ev.cap}" data-ev="cap"><b id="capv">${num(ev.cap, 0)} kWh</b></div></div>` : ""}
  </div>`;
}
function planSvg(plan) {
  const hrs = plan.hours.filter((h) => h.price != null || h.sun != null);
  if (!hrs.length) return `<div class="muted">–</div>`;
  const W = 22, H = 210, top = 14, bottom = 22, n = hrs.length, width = n * W;
  const pmin = Math.min(0, plan.price_min ?? 0), pmax = (plan.price_max || 1) * 1.08;
  const eMax = Math.max(1, ...hrs.map((h) => h.sun || 0), ...hrs.map((h) => h.house || 0)) * 1.15;
  const nowT = new Date(plan.now), y0 = H - bottom, ph = H - top - bottom;
  const col = (p) => { const x = (p - plan.price_min) / Math.max(0.01, plan.price_max - plan.price_min); return `hsl(${Math.round(150 - 150 * x)} 70% ${x > .66 ? 60 : 52}%)`; };
  const gridLines = [0.25, 0.5, 0.75, 1].map((g) => `<line x1="0" x2="${width}" y1="${y0 - g * ph}" y2="${y0 - g * ph}" stroke="var(--line)"/>`).join("");
  const bars = hrs.map((h, i) => {
    const x = i * W, bh = h.price != null ? ((h.price - pmin) / (pmax - pmin)) * ph : 0, t = new Date(h.t);
    const past = t < nowT && !(t.getHours() === nowT.getHours() && t.getDate() === nowT.getDate());
    return `<g data-h="${i}" style="cursor:pointer">${h.price != null ? `<rect x="${x + 5}" y="${y0 - bh}" width="${W - 10}" height="${bh}" rx="3" fill="${col(h.price)}" opacity="${past ? .25 : .85}"/>` : ""}
      ${h.charge ? `<rect x="${x + 5}" y="${y0 + 4}" width="${W - 10}" height="3" rx="1.5" fill="var(--batt)"/>` : ""}
      ${t.getHours() % 3 === 0 ? `<text class="axis" x="${x + W / 2}" y="${H - 4}" text-anchor="middle">${String(t.getHours()).padStart(2, "0")}</text>` : ""}
      ${t.getHours() === 0 && i > 0 ? `<line x1="${x}" x2="${x}" y1="${top}" y2="${y0}" stroke="var(--line2)" stroke-dasharray="2 4"/><text class="axis" x="${x + 4}" y="${top + 8}">${L === "da" ? "I morgen" : "Tomorrow"}</text>` : ""}
      <rect x="${x}" y="0" width="${W}" height="${H}" fill="transparent"/></g>`;
  }).join("");
  const pts = (key) => hrs.map((h, i) => h[key] != null ? [i * W + W / 2, y0 - (h[key] / eMax) * ph] : null).filter(Boolean);
  const smooth = (p) => p.length < 2 ? "" : p.map((q, i) => i ? `L${q[0].toFixed(1)} ${q[1].toFixed(1)}` : `M${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" ");
  const sun = pts("sun"), house = pts("house");
  const sunPath = smooth(sun);
  const nowI = hrs.findIndex((h) => { const t = new Date(h.t); return t.getHours() === nowT.getHours() && t.getDate() === nowT.getDate(); });
  const nowX = nowI >= 0 ? nowI * W + (nowT.getMinutes() / 60) * W : null;
  return `<div class="planwrap" id="planwrap"><svg class="plan" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}">
      <defs><linearGradient id="sung" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--sun)" stop-opacity=".35"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></linearGradient></defs>
      ${gridLines}${bars}
      ${sun.length > 1 ? `<path d="${sunPath} L${sun[sun.length - 1][0]} ${y0} L${sun[0][0]} ${y0}Z" fill="url(#sung)"/><path d="${sunPath}" fill="none" stroke="var(--sun)" stroke-width="2"/>` : ""}
      ${house.length > 1 ? `<path d="${smooth(house)}" fill="none" stroke="var(--house)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".8"/>` : ""}
      ${nowX != null ? `<line x1="${nowX}" x2="${nowX}" y1="${top - 6}" y2="${y0}" stroke="var(--text)" stroke-width="1.5"/><circle cx="${nowX}" cy="${top - 6}" r="3" fill="var(--text)"/>` : ""}
    </svg></div>
    <div class="tip" id="tip">${T.tapHour}</div>
    <div class="legend"><span><i style="background:linear-gradient(90deg,hsl(150 70% 52%),hsl(0 70% 60%))"></i>${T.legPrice}</span><span><i style="background:var(--sun)"></i>${T.legSun}</span>
      <span><i style="background:var(--house)"></i>${T.legHouse}</span><span><i style="background:var(--batt)"></i>${T.legCharge}</span></div>
    ${plan.cheapest.length ? `<div class="eyebrow" style="margin:16px 0 8px"><span>${T.cheapest}</span></div><div class="chips">${plan.cheapest.map((t) => `<span class="chip good">${clock(t)}</span>`).join("")}</div>` : ""}`;
}
function planView() { return `<div class="card fade"><div class="eyebrow"><span>${T.planTitle}</span></div>${planSvg(data.plan)}</div>`; }
function ring(p) {
  const r = 22, c = 2 * Math.PI * r, v = p ?? 0, color = p == null ? "var(--faint)" : p >= 95 ? "var(--ok)" : p >= 80 ? "var(--warn)" : "var(--bad)";
  return `<div class="ring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" stroke="var(--line2)"/><circle cx="26" cy="26" r="${r}" stroke="${color}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v / 100)}"/></svg><b>${p == null ? "–" : p + "%"}</b></div>`;
}
function shadowView() {
  if (!status) return `<div class="card">…</div>`;
  const control = status.apps.some((a) => a.mode === "control");
  return `<div class="card fade"><div class="eyebrow"><span>${T.shadowTitle}</span></div><div class="muted" style="margin-bottom:10px">${T.shadowHint}</div>
    ${status.apps.map((a) => `<div class="app">${ring(a.agree)}<div class="t"><b>${T.names[a.name] || esc(a.name)}</b><span>${a.agree == null ? "–" : a.agree + " % " + T.agree} · ${a.checks} ${T.compare} · ${a.errors} ${T.errors}</span></div>
      <div class="seg">${["shadow", "control", "off"].map((m) => `<button class="${m} ${a.mode === m ? "on" : ""}" data-app="${a.name}" data-mode="${m}">${T.modes[m]}</button>`).join("")}</div></div>
      <details class="more"><summary>${L === "da" ? "Detaljer" : "Details"}</summary><table><tr><th>Sensor</th><th>Pilot</th><th>System</th></tr>
        ${a.entities.map((e) => `<tr><td>${esc(e.entity_id)}</td><td>${esc(e.mine_now)}</td><td>${esc(e.real ?? "–")}</td></tr>`).join("")}</table>
        <table style="margin-top:8px"><tr><th>${L === "da" ? "Ville gøre" : "Would do"}</th><th>Data</th></tr>${a.would.slice(0, 15).map((w) => `<tr><td>${esc(w.service)}</td><td>${esc(JSON.stringify(w.data)).slice(0, 120)}</td></tr>`).join("")}</table></details>`).join("")}
    ${control ? `<button class="stopall" data-stopall>${T.stopAll}</button>` : ""}</div>`;
}
const GROUPICON = { sun: "sun", battery: "battery", grid: "house", car: "car", data: "chart" };
function settingsView() {
  if (!settings) return `<div class="card">…</div>`;
  return `<div class="card fade"><div class="eyebrow"><span>${T.setTitle}</span></div><div class="muted">${T.setHint}</div>
    ${Object.entries(GROUPS).map(([g, roles]) => `<div class="group"><h4>${icon(GROUPICON[g])}${T.groups[g]}</h4>${roles.map((r) => {
      const chosen = (settings.settings.roles || {})[r], foundId = settings.roles[r];
      const found = foundId ? ((settings.candidates[r] || []).find((c) => c.entity_id === foundId)?.name || foundId) : null;
      const opts = (settings.candidates[r] || []).map((c) => `<option value="${c.entity_id}" ${chosen === c.entity_id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
      return `<div class="set"><span>${T.roles[r]}</span><select data-role="${r}"><option value="__auto" ${chosen == null ? "selected" : ""}>${T.auto}${found ? ": " + esc(found) : ""}</option>
        <option value="" ${chosen === "" ? "selected" : ""}>${T.none}</option>${opts}</select></div>`;
    }).join("")}</div>`).join("")}</div>`;
}

/* ---------- drawing and updating ---------- */
function render() {
  const root = $("#root");
  if (!data) return;
  const control = (data.shadow || []).filter((a) => a.mode === "control").length;
  const body = tab === "plan" ? planView() : tab === "shadow" ? shadowView() : tab === "settings" ? settingsView() : home();
  root.innerHTML = `<div class="top"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="${"M13 2 4 14h7l-1 8 9-12h-7z"}"/></svg></span><h1>${T.title}</h1></div>
    <span class="badge ${control ? "live" : ""}"><i></i>${control ? `${control} ${T.modes.control.toLowerCase()}` : T.modes.shadow}</span></div>${body}`;
  const TABICON = { home: "gauge", plan: "chart", shadow: "layers", settings: "sliders" };
  $("#tabs").innerHTML = Object.entries(T.tabs).map(([k, v]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}">${icon(TABICON[k])}<span>${v}</span></button>`).join("");
  flowKey = flowSig(data.flow);
  wire();
  const pw = $("#planwrap"), now = pw?.querySelector("line[stroke='var(--text)']");
  if (pw && now) pw.scrollLeft = Math.max(0, Number(now.getAttribute("x1")) - pw.clientWidth / 3);
}
function patch() {
  // Only the numbers - the beams keep running.
  const f = data.flow;
  if (flowSig(f) !== flowKey) { const el = $("#flow"); if (el) { el.innerHTML = flowSvg(f); flowKey = flowSig(f); } return; }
  const setv = (id, pair) => { const v = document.getElementById("v-" + id); if (v && v.firstChild) { v.firstChild.nodeValue = pair[0]; const u = document.getElementById("u-" + id); if (u) u.textContent = pair[1] ? " " + pair[1] : ""; } };
  setv("sun", split(f.pv)); setv("house", split(f.house)); setv("grid", split(f.grid)); setv("battery", [num(f.soc, 0), "%"]);
  if (f.ev > 30) setv("car", split(f.ev));
  const c = document.getElementById("c-battery");
  if (c) c.textContent = `${f.battery > 30 ? T.charging : f.battery < -30 ? T.discharging : T.idle} ${f.battery && Math.abs(f.battery) > 30 ? kw(f.battery) : ""}`.trim().toUpperCase();
  const tp = document.getElementById("t-price"); if (tp && tp.firstChild) tp.firstChild.nodeValue = num(data.price.now, 2);
  const ts = document.getElementById("t-soc"); if (ts && ts.firstChild) ts.firstChild.nodeValue = num(f.soc, 0);
  const sb = document.getElementById("t-socbar"); if (sb) sb.style.width = `${f.soc}%`;
  const ring = document.getElementById("socring");
  if (ring) ring.setAttribute("stroke-dashoffset", 2 * Math.PI * 38 * (1 - (f.soc || 0) / 100));
}
function wire() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = async () => {
    tab = b.dataset.tab; localStorage.setItem("ep_tab", tab);
    if (tab === "shadow") status = await api("/api/status");
    if (tab === "settings") settings = await api("/api/settings");
    render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll("[data-h]").forEach((g) => g.onclick = () => {
    const h = data.plan.hours.filter((x) => x.price != null || x.sun != null)[Number(g.dataset.h)];
    $("#tip").innerHTML = `<b>${clock(h.t)}</b> · ${kr(h.price)}/kWh${h.sun != null ? ` · ${T.legSun} ${num(h.sun, 1)} kWh` : ""}${h.house != null ? ` · ${T.legHouse} ${num(h.house, 1)} kWh` : ""}${h.charge ? ` · ${T.legCharge}` : ""}`;
  });
  document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = async () => {
    if (b.dataset.mode === "control" && !confirm(T.confirm)) return;
    await api("/api/mode", { app: b.dataset.app, mode: b.dataset.mode }); status = await api("/api/status"); await load(); render();
  });
  $("[data-stopall]")?.addEventListener("click", async () => { await api("/api/shadow_all", {}); status = await api("/api/status"); await load(); render(); });
  document.querySelectorAll("[data-role]").forEach((s) => s.onchange = async () => {
    await api("/api/settings", { roles: { [s.dataset.role]: s.value === "__auto" ? null : s.value } }); settings = await api("/api/settings"); await load();
  });
  $("[data-ev=manual]")?.addEventListener("click", async (e) => { const b = e.currentTarget, on = !b.classList.contains("on"); b.classList.toggle("on", on); await api("/api/ev", { manual: on }); });
  $("[data-ev=ready]")?.addEventListener("change", (e) => api("/api/ev", { ready: e.target.value + ":00" }));
  const cap = $("[data-ev=cap]");
  cap?.addEventListener("input", () => ($("#capv").textContent = `${cap.value} kWh`));
  cap?.addEventListener("change", () => api("/api/ev", { cap: Number(cap.value) }));
}
async function load() { data = await api("/api/overview?lang=" + L).catch(() => data); }
(async () => {
  await load();
  if (tab === "shadow") status = await api("/api/status");
  if (tab === "settings") settings = await api("/api/settings");
  render();
  setInterval(async () => {
    if (document.hidden) return;
    await load();
    if (tab === "home") patch();
    if (tab === "shadow") { status = await api("/api/status"); if (!document.querySelector("details[open]")) render(); }
  }, 4000);
  setInterval(() => { if (tab === "home" || tab === "plan") render(); }, 300000);
})();
</script>
</body>
</html>
