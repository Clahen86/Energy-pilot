  .toggle::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; transition:.25s; box-shadow:0 2px 6px rgba(0,0,0,.3); }

  document.querySelectorAll("[data-psrc]").forEach((b) => b.onclick = () => saveSet({ price_source: b.dataset.psrc === "auto" ? null : b.dataset.psrc }));
  const tou = () => JSON.parse(JSON.stringify(settings.settings.tou || { default: 0, periods: [] }));
  $("[data-tou-preset]")?.addEventListener("change", (e) => { const p = settings.tou_presets[e.target.value]; if (p) saveSet({ tou: { default: p.default, periods: p.periods } }); });
  $("[data-tou-default]")?.addEventListener("change", (e) => { const t = tou(); t.default = Number(e.target.value.replace(",", ".")); saveSet({ tou: t }); });
  $("[data-tou-add]")?.addEventListener("click", () => { const t = tou(); t.periods.push({ name: "", price: t.default, from: "17:00", to: "21:00", days: "all" }); saveSet({ tou: t }); });
  for (const [attr, key, conv] of [["data-tou-name", "name", String], ["data-tou-from", "from", String], ["data-tou-to", "to", String],
    ["data-tou-days", "days", String], ["data-tou-price", "price", (x) => Number(String(x).replace(",", "."))]]) {
    document.querySelectorAll(`[${attr}]`).forEach((el) => el.onchange = () => { const t = tou(); t.periods[Number(el.getAttribute(attr))][key] = conv(el.value); saveSet({ tou: t }); });
  }
  document.querySelectorAll("[data-tou-del]").forEach((b) => b.onclick = () => { const t = tou(); t.periods.splice(Number(b.dataset.touDel), 1); saveSet({ tou: t }); });
  document.querySelectorAll("[data-area]").forEach((b) => b.onclick = () => saveSet({ price_area: b.dataset.area }));
  document.querySelectorAll("[data-tariff]").forEach((i) => i.onchange = () => saveSet({ tariff: { ...(settings.settings.tariff || {}), [i.dataset.tariff]: i.value === "" ? undefined : Number(i.value.replace(",", ".")) } }));
  document.querySelectorAll("[data-evmode]").forEach((b) => b.onclick = () => saveSet({ ev_mode: b.dataset.evmode }));
  document.querySelectorAll("[data-step]").forEach((b) => b.onclick = () => { step = Number(b.dataset.step); render(); window.scrollTo(0, 0); });
  $("[data-finish]")?.addEventListener("click", async () => { await api("/api/settings", { setup_done: true }); await load(); tab = "home"; localStorage.setItem("ep_tab", tab); render(); });
  $("[data-setup]")?.addEventListener("click", () => { step = 1; tab = "setup"; render(); window.scrollTo(0, 0); });
  $("[data-redetect]")?.addEventListener("click", async (e) => { e.target.textContent = "…"; await api("/api/detect", {}); settings = await api("/api/settings"); await load(); render(); });
  $("[data-ev=manual]")?.addEventListener("click", async (e) => { const b = e.currentTarget, on = !b.classList.contains("on"); b.classList.toggle("on", on); await api("/api/ev", { manual: on }); });
  $("[data-ev=ready]")?.addEventListener("change", (e) => api("/api/ev", { ready: e.target.value + ":00" }));
  const cap = $("[data-ev=cap]");
  cap?.addEventListener("input", () => ($("#capv").textContent = `${cap.value} kWh`));
  cap?.addEventListener("change", () => api("/api/ev", { cap: Number(cap.value) }));
}
async function load() { data = await api("/api/overview?lang=" + L).catch(() => data); }
(async () => {
  await load();
  if (data && !data.setup_done) tab = "setup";
  if (tab === "setup") settings = await api("/api/settings");
  if (tab === "shadow") status = await api("/api/status");
  if (tab === "settings") settings = await api("/api/settings");
  render();
  setInterval(async () => {
    if (document.hidden) return;
    await load();
    if (tab === "home") patch();
    if (tab === "shadow") { status = await api("/api/status"); if (!document.querySelector("details[open]")) render(); }
  }, 4000);
  setInterval(() => { if (tab === "home" || tab === "plan") render(); }, 300000);
})();
</script>
</body>
</html>
