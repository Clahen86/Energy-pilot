name: Energy Pilot
version: "0.111.0"
slug: energy_pilot
description: Battery, solar and EV charging in one app - in shadow first, in control when you say so.
url: https://github.com/Clahen86/Energy-pilot
image: "ghcr.io/clahen86/{arch}-energy-pilot-addon"
arch:
  - amd64
  - aarch64
init: false
timeout: 30  # seconds to let go of the battery when stopped (main.py)
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt-circle
panel_title: Energy Pilot
homeassistant_api: true
discovery:
  - energy_pilot
hassio_api: true
map:
  - addon_config:rw
  - homeassistant_config:rw
options: {}
schema:
  apps_dir: str?
  seed_from: str?
