name: Energipilot
version: "0.102.1"
slug: energy_pilot
description: Batteri, sol og bilopladning i én app - i skygge først, styrer når du siger til.
url: https://github.com/Clahen86/Energy-pilot
image: "ghcr.io/clahen86/{arch}-energy-pilot-addon"
arch:
  - amd64
  - aarch64
init: false
timeout: 30  # seconds to let go of the battery when stopped (main.py)
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt-circle
panel_title: Energipilot
homeassistant_api: true
discovery:
  - energy_pilot
hassio_api: true
map:
  - addon_config:rw
  - all_addon_configs:ro
  - homeassistant_config:rw
options: {}
schema:
  apps_dir: str?
  seed_from: str?
