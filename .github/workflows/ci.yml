name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The same maths libraries as the add-on: the ML tests run too, not skipped
      - run: pip install pytest pytest-asyncio aiohttp holidays numpy pandas joblib "scikit-learn==1.9.1"
      - run: pytest -q tests

  companion:
    # The Home Assistant integration in a real Home Assistant test harness (on its own: it doesn't hold up the images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: mkdir -p custom_components && cp -r energy_pilot/integration/energy_pilot custom_components/ && touch custom_components/__init__.py
      - run: python -m pytest -q tests_integration -c /dev/null --rootdir .

  docker:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
          tags: |
            ghcr.io/clahen86/energy-pilot:latest
            ghcr.io/clahen86/energy-pilot:${{ github.ref_name == 'main' && 'edge' || github.ref_name }}

  addon:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^version: \"$V\"" energy_pilot/config.yaml || { echo "tag != config.yaml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: energy_pilot
          platforms: ${{ matrix.platform }}
          push: true
          # the big layer (pandas, numpy, scikit-learn) is kept between versions: an update only downloads what changed
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
          build-args: BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          tags: ghcr.io/clahen86/${{ matrix.arch }}-energy-pilot-addon:${{ steps.v.outputs.version }}
