name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio aiohttp holidays
      - run: pytest -q tests

  docker:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/clahen86/energy-pilot:latest
            ghcr.io/clahen86/energy-pilot:${{ github.ref_name == 'main' && 'edge' || github.ref_name }}

  addon:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^version: \"$V\"" energy_pilot/config.yaml || { echo "tag != config.yaml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: energy_pilot
          platforms: ${{ matrix.platform }}
          push: true
          build-args: BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          tags: ghcr.io/clahen86/${{ matrix.arch }}-energy-pilot-addon:${{ steps.v.outputs.version }}
