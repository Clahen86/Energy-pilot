# Træning: every night shared models are trained on all houses' hourly lines and measured against each house's own
# forecast. Only totals reach the summary; the data never enters this public repository. The models are kept as a
# workflow artifact (30 days) - they're handed to Energy Pilot only once they beat the houses' own forecasts.
name: Træning
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["training/train.py", "training/sensors.py", "training/reports.py", ".github/workflows/training.yml"]

permissions:
  contents: read
  issues: write  # the nightly reports (profile drafts, failure patterns) - to the developer only

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn
      - name: Selvtest (opdigtede data)
        run: |
          python training/synth.py "$RUNNER_TEMP/synth.json"
          python training/train.py "$RUNNER_TEMP/synth.json" "$RUNNER_TEMP/synth_models" | tee "$RUNNER_TEMP/synth.md"
          grep -q "| Forbrug |" "$RUNNER_TEMP/synth.md"
      - name: Hent time-tal og opsætninger
        env:
          EP_EXPORT_KEY: ${{ secrets.EP_EXPORT_KEY }}
          EP_FETCH_SETUPS: ${{ runner.temp }}/setups.json
          EP_FETCH_TESTS: ${{ runner.temp }}/tests.json
        run: python training/fetch.py "$RUNNER_TEMP/data.json" "$(date -d '-120 days' +%F)"
      - name: Sensorfinder
        env:
          EP_EXPORT_KEY: ${{ secrets.EP_EXPORT_KEY }}
        run: |
          curl -sf https://ep-reports.clahen86.workers.dev/fixes -o "$RUNNER_TEMP/now.json" || echo '{}' > "$RUNNER_TEMP/now.json"
          python training/sensors.py "$RUNNER_TEMP/setups.json" "$RUNNER_TEMP/sensors.json" "$RUNNER_TEMP/now.json" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; print(json.dumps({'sensors': json.load(open('$RUNNER_TEMP/sensors.json'))}))" > "$RUNNER_TEMP/models.json"
          curl -sf -X POST -H "content-type: application/json" --data-binary @"$RUNNER_TEMP/models.json" \
            "https://ep-reports.clahen86.workers.dev/models?key=$EP_EXPORT_KEY" > /dev/null && echo "Sendt ud til Energipilot." >> "$GITHUB_STEP_SUMMARY" \
            || echo "⚠️ Kunne ikke sendes til workeren." >> "$GITHUB_STEP_SUMMARY"
      - name: Rapporter til udvikleren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --search "⚡ in:title" --json title,state,body > "$RUNNER_TEMP/known.json" || echo '[]' > "$RUNNER_TEMP/known.json"
          python training/reports.py "$RUNNER_TEMP/setups.json" "$RUNNER_TEMP/tests.json" "$RUNNER_TEMP/issues.json" "$RUNNER_TEMP/known.json" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os, subprocess
          t = os.environ["RUNNER_TEMP"]
          for i in json.load(open(f"{t}/issues.json"))[:10]:
              subprocess.run(["gh", "issue", "create", "--repo", os.environ["GITHUB_REPOSITORY"], "--title", i["title"], "--body", i["body"]], check=False)
          PY
      - name: Træn og mål
        run: python training/train.py "$RUNNER_TEMP/data.json" "$RUNNER_TEMP/models" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: models
          path: ${{ runner.temp }}/models
          retention-days: 30
          if-no-files-found: ignore
